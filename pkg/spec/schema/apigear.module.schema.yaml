$schema: "http://json-schema.org/draft-07/schema#"
description: |
  This is the schema for the ObjectAPI 1.0 specification.
  It is used to validate the ObjectAPI 1.0 specification.

  Model overview: a module groups interfaces, structs and enums. An interface
  describes a reactive object that may live locally or be accessed remotely
  (e.g. over ApiGear ObjectLink). It has three member kinds:
    - properties: observable state. Each property automatically gets a getter,
      a setter (unless readonly) and a change-notification signal - never add a
      separate signal just to report a property change.
    - operations: callable methods with parameters and an optional return value;
      depending on the target they may complete asynchronously.
    - signals: one-way notifications emitted to subscribers; they carry
      parameters but never return a value.
  Property, operation and signal names share one namespace per interface and
  must all be unique (including each property's implicit change signal). Types
  from another module require both an 'import' on the type and an entry in the
  top-level 'imports' array.

  An example of a valid ObjectAPI 1.0 specification is:

  ```
  schema: apigear.module/1.0
  name: my.module
  version: 1.0
  interfaces:
    - name: Counter
      properties:
        - name: value
          type: int
      operations:
        - name: increment
          params:
            - name: value
              type: int
          return: int
        - name: decrement
          params:
            - name: value
              type: int
          return: int
  ```

title: "ObjectAPI 1.0 Schema"
type: object
additionalProperties: false
required: [name]
properties:
  schema:
    type: string
    description: "The ApiGear ObjectAPI specification version of this document."
    enum: ["apigear.module/1.0"]
    default: "apigear.module/1.0"
  name:
    type: string
    description: Module name inside the system. A module name must be unique inside the generated system. Starts with a letter, followed by letters, numbers, underscores or dots (e.g. a.b.c)
    pattern: "^[a-zA-Z][0-9A-Za-z_.]*$"
  imports:
    type: array
    description: A list of imported modules
    items:
      type: object
      required: [name]
      additionalProperties: false
      properties:
        name:
          type: string
          description: Module name to import, starts with a letter, followed by letters, numbers, underscores or dots (e.g. a.b.c)
          pattern: "^[a-zA-Z][0-9A-Za-z_.]*$"
        description:
          type: string
          description: Import description. Should be a short description for the import
        meta:
          type: object
          description: Meta information for the import. Read the template manual which meta tags are supported.
  version:
    type: string
    description: Module version, should be a major and minor and an optional patch version, separated by a dot.
    pattern: "^[0-9]+[.][0-9]+([.][0-9]+)*$"
    default: "1.0"
  description:
    type: string
    description: Module description. Should be a short description of the module.
  meta:
    type: object
    description: Meta information are read by the individual template. Read the template manual which meta tags are supported.
  externs:
    type: array
    description: A list of externs, exported by this module. Externs are native types defined outside of the module and handled by the template.
    items:
      $ref: "#/definitions/Extern"
  interfaces:
    type: array
    description: A list of interfaces, defined by this module
    items:
      $ref: "#/definitions/Interface"
  structs:
    type: array
    description: A list of data structures, defined by this module
    items:
      $ref: "#/definitions/Struct"
  enums:
    type: array
    description: A list of enumerations, defined by this module
    items:
      $ref: "#/definitions/Enum"

definitions:
  NamedType:
    type: object
    description: "Type information with a name. (e.g. name is a string)"
    required: [name, type]
    additionalProperties: false
    properties:
      name:
        type: string
        description: "A name starts with a letter, followed by zero-or-more letters, numbers or underscores."
        pattern: "^[a-zA-Z][0-9A-Za-z_]*$"
      description:
        type: string
        description: "A description of the type. Should be a short, descriptive text about the type."
      meta:
        type: object
        description: "Meta information are read by the individual template. Read the template manual which meta tags are supported."
      type:
        type: string
        description: "The type: either a primitive type (bool, int, int32, int64, float, float32, float64, string, bytes, any) or the name of a declared type (an interface, struct or enum). Note: there is no int16/float16. For a type declared in another module, also set 'import' (see below)."
      import:
        type: string
        description: "If the type is defined in another module, this is that module's name. The module must also be listed in the top-level 'imports' array, otherwise the reference will not resolve."
      array:
        type: boolean
        description: "If true, the type is an array of the given type."
      readonly:
        type: boolean
        description: "Only meaningful for interface properties: if true, the property is read-only and no setter is generated. Has no effect on struct fields or operation parameters."
  Type:
    type: object
    description: "A type information without a name. (e.g. int), used for return types."
    required: [type]
    additionalProperties: false
    properties:
      description:
        type: string
        description: "A description of the type."
      meta:
        type: object
        description: "Meta information are read by the individual template. Read the template manual which meta tags are supported."
      type:
        type: string
        description: "The return type: a primitive type (bool, int, int32, int64, float, float32, float64, string, bytes, any) or a declared type (interface, struct or enum)."
      import:
        type: string
        description: "If the type is defined in another module, this is that module's name. The module must also be listed in the top-level 'imports' array, otherwise the reference will not resolve."
      array:
        type: boolean
        description: "If true, the type is an array of the given type."
  Extern:
    type: object
    description: "An extern is a reference to a type to a native type defined outside of the set of modules."
    required: [name]
    additionalProperties: false
    properties:
      name:
        type: string
        description: "A name starts with a letter, followed by zero-or-more letters, numbers or underscores."
        pattern: "^[a-zA-Z][0-9A-Za-z_]*$"
      description:
        type: string
        description: "A description of the extern."
      meta:
        type: object
        description: "Meta information is evaluated by the individual template. Read the template manual which meta tags are supported."
  Interface:
    type: object
    description: "An interface is a collection of reactive properties, callable operations and emittable signals. Names of properties, operations and signals share one namespace and must all be unique within the interface (this includes each property's auto-generated change signal)."
    required: [name]
    additionalProperties: false
    properties:
      name:
        type: string
        description: "The interface name, typical upper camel case (Vehicle, Ball). A name starts with a letter, followed by zero-or-more letters, numbers or underscores."
        pattern: "^[a-zA-Z][0-9A-Za-z_]*$"
      description:
        type: string
        description: "A description of the interface. This should provide a clear and concise explanation of the interface's purpose and functionality."
      extends:
        type: object
        description: "References a single base interface. Inheritance is technology-neutral and delegated to the target template, which is expected to render it as native inheritance (e.g. C++ ': public Base', Java 'extends Base'). Declare only the members this interface ADDS - do NOT re-declare the base's properties, operations or signals, as that would produce redundant overrides or shadowing in the generated code. Set 'import' when the base interface is in another module. Note: support is template-dependent and the bundled templates do not currently render extends, so inherited members may be absent in generated output."
        required: [name]
        additionalProperties: false
        properties:
          name:
            type: string
            description: "The base interface this interface extends from. A name starts with a letter, followed by zero-or-more letters, numbers or underscores."
            pattern: "^[a-zA-Z][0-9A-Za-z_]*$"
          import:
            type: string
            description: "The name of the module where the base interface is defined. If it is another module, that module must also be listed in the top-level 'imports' array."
      meta:
        type: object
        description: "Meta information is evaluated by the individual template. Read the template manual which meta tags are supported."
      properties:
        type: array
        description: "An array of reactive properties. For each property the generated SDK automatically provides a getter, a setter (unless 'readonly' is set) and a change-notification signal that fires whenever the value changes. Do NOT declare a separate signal to report a property change - it already exists. Exact generated names (e.g. getX/setX/onXChanged) depend on the target language template."
        items:
          $ref: "#/definitions/NamedType"
      operations:
        type: array
        description: "An array of callable operations with parameters and a return type."
        items:
          $ref: "#/definitions/Operation"
      signals:
        type: array
        description: "An array of signals the interface can emit. Declare only signals that are NOT already implied by a property change (see 'properties')."
        items:
          $ref: "#/definitions/Signal"
  Struct:
    type: object
    description: "A struct is a message format that groups related data fields under a single name."
    required: [name]
    additionalProperties: false
    properties:
      name:
        type: string
        description: "A name starts with a letter, followed by zero-or-more letters, numbers or underscores."
        pattern: "^[a-zA-Z][0-9A-Za-z_]*$"
      description:
        type: string
        description: "A description of the struct."
      meta:
        type: object
        description: "Meta information is evaluated by the individual template. Read the template manual which meta tags are supported."
      fields:
        type: array
        description: "An array of fields."
        items:
          $ref: "#/definitions/NamedType"
  Enum:
    type: object
    description: "An enum is an enumeration type that consists of a set of named values."
    required: [name]
    additionalProperties: false
    properties:
      name:
        type: string
        description: "A name starts with a letter, followed by zero-or-more letters, numbers or underscores."
        pattern: "^[a-zA-Z][0-9A-Za-z_]*$"
      description:
        type: string
        description: "A description of the enum."
      meta:
        type: object
        description: "Meta information is evaluated by the individual template. Read the template manual which meta tags are supported."
      members:
        type: array
        description: "An array of members."
        items:
          $ref: "#/definitions/EnumMember"
  Operation:
    type: object
    description: "An operation is a callable interface method with parameters and an optional return type. Omit 'return' (or set its type to 'void') for operations that return nothing."
    additionalProperties: false
    required: [name]
    properties:
      name:
        type: string
        description: "A name starts with a letter, followed by zero-or-more letters, numbers or underscores."
        pattern: "^[a-zA-Z][0-9A-Za-z_]*$"
      description:
        type: string
        description: "A description of the operation. Should be a short, descriptive text about the operation."
      meta:
        type: object
        description: "Meta information is evaluated by the individual template. Read the template manual which meta tags are supported."
      return:
        $ref: "#/definitions/Type"
      params:
        type: array
        description: "An array of operation parameters."
        items:
          $ref: "#/definitions/NamedType"
  Signal:
    type: object
    description: "A signal is a one-way notification emitted by the interface to its subscribers. Signals carry parameters but never return a value."
    additionalProperties: false
    required: [name]
    properties:
      name:
        type: string
        description: "A name starts with a letter, followed by zero-or-more letters, numbers or underscores."
        pattern: "^[a-zA-Z][0-9A-Za-z_]*$"
      description:
        type: string
        description: "A description of the signal. Should be a short, descriptive text about when the signal is emitted."
      meta:
        type: object
        description: "Meta information is evaluated by the individual template. Read the template manual which meta tags are supported."
      params:
        type: array
        description: "An array of signal parameters."
        items:
          $ref: "#/definitions/NamedType"
  EnumMember: # member value inside an enum
    type: object
    description: "An enum member is a name, value pair."
    additionalProperties: false
    required: [name]
    properties:
      name:
        type: string
        description: "A name starts with a letter, followed by zero-or-more letters, numbers or underscores."
        pattern: "^[a-zA-Z][0-9A-Za-z_]*$"
      description:
        type: string
        description: "A description of the enum member."
      meta:
        type: object
        description: "Meta information are read by the individual template. Read the template manual which meta tags are supported."
      value:
        type: integer
        description: "The non-negative integer value of the enum member, unique within the enum. Auto-numbering is all-or-nothing: if you omit 'value' on EVERY member, members are numbered 0, 1, 2 ... by position; but as soon as you set 'value' on ANY member, auto-numbering is disabled and every member left without a 'value' stays 0 (which may collide). So specify either all values or none."
        minimum: 0
